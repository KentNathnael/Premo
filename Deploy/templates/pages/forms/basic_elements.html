<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Premo</title>

    <link rel="stylesheet" href="../../assets/vendors/mdi/css/materialdesignicons.min.css">

    <link rel="stylesheet" href="../../assets/vendors/css/vendor.bundle.base.css">
    <link rel="stylesheet" href="../../assets/vendors/font-awesome/css/font-awesome.min.css">
    <!-- endinject -->

    <link rel="stylesheet" href="../../assets/vendors/select2/select2.min.css">
    <link rel="stylesheet" href="../../assets/vendors/select2-bootstrap-theme/select2-bootstrap.min.css">
    <!-- End plugin css for this page -->
    <!-- inject:css -->
    <!-- endinject -->

    <link rel="stylesheet" href="../../assets/css/style.css">

    <link rel="shortcut icon" href="../../assets/images/favicon.png" />
  </head>
  <body>
    <div class="container-scroller">
      <!-- partial:../../partials/_navbar.html -->
      <nav class="navbar default-layout-navbar col-lg-12 col-12 p-0 fixed-top d-flex flex-row">
        <div class="text-center navbar-brand-wrapper d-flex align-items-center justify-content-start">
          <a class="navbar-brand brand-logo" href="/"><img src="../../assets/images/logo.svg" alt="logo" /></a>
          <a class="navbar-brand brand-logo-mini" href="/"><img src="../../assets/images/logo-mini.svg" alt="logo" /></a>
        </div>
        <div class="navbar-menu-wrapper d-flex align-items-stretch">
          <button class="navbar-toggler navbar-toggler align-self-center" type="button" data-toggle="minimize">
            <span class="mdi mdi-menu"></span>
          </button>
          <ul class="navbar-nav navbar-nav-right">
            <li class="nav-item d-none d-lg-block full-screen-link">
              <a class="nav-link">
                <i class="mdi mdi-fullscreen" id="fullscreen-button"></i>
              </a>
            </li>
          </ul>
          <button class="navbar-toggler navbar-toggler-right d-lg-none align-self-center" type="button" data-toggle="offcanvas">
            <span class="mdi mdi-menu"></span>
          </button>
        </div>
      </nav>
      <!-- partial -->
      <div class="container-fluid page-body-wrapper">
        <!-- partial:../../partials/_sidebar.html -->
        <nav class="sidebar sidebar-offcanvas" id="sidebar">
          <ul class="nav">
            <li class="nav-item">
              <a class="nav-link" href="/">
                <span class="menu-title">Dashboard</span>
                <i class="mdi mdi-home menu-icon"></i>
              </a>
            </li>
          </ul>
        </nav>
        <!-- partial -->
        <div class="main-panel">
          <div class="content-wrapper">
            <div class="row">
              <div class="col-12 grid-margin stretch-card">
                <div class="card">
                  <div class="card-body">
                    <h4 class="card-title">Forms Price Prediction</h4>
                    <p class="card-description">Vehicle Price Prediction</p>

                    <form class="forms-sample" method="post">
                      <div class="form-group">
                        <label for="exampleInputName1">Make</label>
                        <select class="form-select" id="exampleInputName1" onchange="this.form.submit()" name="make">
                          <option value="">--Please Choice Make--</option>
                            {% for item in makes %}
                                <option value="{{ item[0] }}" {% if selected_make == item[0] %}selected{% endif %}>{{ item[0] }}</option>
                            {% endfor %}
                        </select>
                      </div>
                      <div class="form-group">
                        <label for="exampleInputEmail3">Model</label>
                        <select class="form-select" id="exampleInputEmail3" name="model" onchange="this.form.submit()">
                          <Option value="">--Please Choice Model</Option>
                          {% for item in models %}
                              <option value="{{ item[0] }}" {% if selected_model == item[0] %}selected{% endif %}>{{ item[0] }}</option>
                          {% endfor %}
                        </select>
                      </div>
                      <div class="form-group">
                        <label for="exampleInputPassword4">Trim</label>
                        <select class="form-select" id="exampleInputPassword4" name="trim" onchange="this.form.submit()">
                          <Option value="">--Please Choice Trim--</Option>
                          {% for item in trims %}
                            <option value="{{ item[0] }}" {% if selected_trim == item[0] %}selected{% endif %}>{{ item[0] }}</option>
                          {% endfor %}  
                        </select>
                      </div>
                      <div class="form-group">
                        <label for="exampleSelectGender">Year</label>
                        <select class="form-select" id="exampleSelectGender" name="year" onchange="this.form.submit()">
                          <Option value="">--Please Choice Year--</Option>
                          {% for item in years %}
                            <option value="{{ item[0] }}" {% if selected_year|string == item[0]|string %}selected{% endif %}>{{ item[0] }}</option>
                          {% endfor %}
                        </select>
                      </div>
                      <div class="form-group">
                        <label for="exampleInputCity1">Odometer</label>
                        <input type="text" class="form-control" id="exampleInputUsername1" placeholder="Please input Odometer" name="odometer">
                      </div>
                      <div class="form-group">
                        <label for="exampleInputCity1">Condition</label>
                        <select class="form-select" id="exampleInputCity1" name="condition">
                          <Option value="">--Please Choice Condition--</Option>
                          {% for item in conditions %}
                            <option value="{{ item[0] }}">{{ item[0] }}</option>
                          {% endfor %}
                        </select>
                      </div>
                      <div class="form-group">
                        <label for="exampleInputCity1">Interior</label>
                        <select class="form-select" id="exampleInputCity1" name="interior" onchange="this.form.submit()">
                          <Option value="">--Please Choice Interior--</Option>
                          {% for item in interior %}
                            <option value="{{ item[0] }}" {% if selected_interior == item[0] %}selected{% endif %}>{{ item[0] }}</option>
                          {% endfor %}
                        </select>
                      </div>
                      <div class="form-group">
                        <label for="exampleInputCity1">Sale Year</label>
                        <select class="form-select" id="exampleInputCity1" name="SaleDate">
                          <Option value="">--Please Choice Sale Date--</Option>
                          {% for item in sales_years %}
                            <option value="{{ item[0] }}">{{ item[0] }}</option>
                          {% endfor %}
                        </select>
                      </div>
                      <button type="submit" class="btn btn-gradient-primary me-2">Submit</button>
                      <button class="btn btn-light">Cancel</button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!-- content-wrapper ends -->
          <!-- partial:../../partials/_footer.html -->
          <footer class="footer">
            <div class="d-sm-flex justify-content-center justify-content-sm-between">
              <span class="text-muted text-center text-sm-left d-block d-sm-inline-block">Copyright © 2023 <a href="https://www.bootstrapdash.com/" target="_blank">BootstrapDash</a>. All rights reserved. Distributed by <a href="http://themewagon.com" target="_blank">ThemeWagon</a></span>
              <span class="float-none float-sm-right d-block mt-1 mt-sm-0 text-center">Hand-crafted & made with <i class="mdi mdi-heart text-danger"></i></span>
            </div>
          </footer>
          <!-- partial -->
        </div>
        <!-- main-panel ends -->
      </div>
      <!-- page-body-wrapper ends -->
    </div>
    <!-- container-scroller -->
    <!-- plugins:js -->
    <script src="../../assets/vendors/js/vendor.bundle.base.js"></script>
    <!-- endinject -->
    <!-- Plugin js for this page -->
    <script src="../../assets/vendors/select2/select2.min.js"></script>
    <script src="../../assets/vendors/typeahead.js/typeahead.bundle.min.js"></script>
    <!-- End plugin js for this page -->
    <!-- inject:js -->
    <script src="../../assets/js/off-canvas.js"></script>
    <script src="../../assets/js/misc.js"></script>
    <script src="../../assets/js/settings.js"></script>
    <script src="../../assets/js/todolist.js"></script>
    <script src="../../assets/js/jquery.cookie.js"></script>
    <!-- endinject -->
    <!-- Custom js for this page -->
    <script src="../../assets/js/file-upload.js"></script>
    <script src="../../assets/js/typeahead.js"></script>
    <script src="../../assets/js/select2.js"></script>
    <!-- End custom js for this page -->
  </body>
</html>
